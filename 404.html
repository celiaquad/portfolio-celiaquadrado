<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Célia Quadrado</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @font-face{ font-family:'Fraunces'; font-style:normal; font-weight:200; src:url('/fonts/fraunces-200.woff2') format('woff2'); font-display:swap; }
  @font-face{ font-family:'Fraunces'; font-style:italic; font-weight:200; src:url('/fonts/fraunces-200-italic.woff2') format('woff2'); font-display:swap; }
  @font-face{ font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; src:url('/fonts/ibm-plex-mono-400.woff2') format('woff2'); font-display:swap; }
  :root{ --bg:#0a0a0a; --text:#f4f2ee; --muted:#8a8886; --line:rgba(244,242,238,0.16); --serif:'Fraunces', serif; --mono:'IBM Plex Mono', monospace; }
  body{ margin:0; min-height:100svh; display:flex; align-items:center; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:clamp(28px,6vw,64px) clamp(18px,4vw,48px); }
  .code{ font-family:var(--mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); padding-bottom:14px; border-bottom:1px solid var(--line); }
  h1{ font-family:var(--serif); font-weight:200; font-size:clamp(2.4rem,8vw,5rem); line-height:1; letter-spacing:-0.03em; margin:28px 0 32px; }
  h1 em{ font-style:italic; }
  a{ font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">Erreur 404</div>
  <h1>Cette page <em>n'existe pas</em>.</h1>
  <a href="/">← Retour au portfolio</a>
</div>
</body>
</html>
